<header class="agendamento-header">
  <div class="container header-container">
    <div class="logo" routerLink="/">
      <img ngSrc="assets/icons/Logo Taíse.png" width="40" height="40" priority alt="Logo Taíse Yoga" class="logo-icon">
      <span class="logo-text">TAÍSE YOGA</span>
    </div>

    <nav class="user-nav" aria-label="Ações da conta" style="display: flex; align-items: center; gap: 1rem;">
      @if (authService.currentUser()) {
        <span class="user-welcome" style="font-size: 0.9rem; color: #547c6a;">Olá, <strong>{{ authService.currentUser() }}</strong></span>
      }
      <button type="button" class="btn-logout" (click)="logout()" aria-label="Encerrar sessão e voltar para a tela de login">
        <span>Sair</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </nav>
  </div>
</header>
